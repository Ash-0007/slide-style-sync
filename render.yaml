# render.yaml
services:
  - type: web
    name: slide-style-sync
    runtime: python
    python:
      version: "3.12"  # Python version - adjust as needed
    buildCommand: |
      pip install -r requirements.txt
    startCommand: |
      gunicorn --worker-class uvicorn.workers.UvicornWorker --workers 4 --bind 0.0.0.0:10000 backend_main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: IMAGES_FOLDER
        value: /var/data/images_server
      - key: TEMP_FOLDER
        value: /var/data/temp_files
    healthCheckPath: /health
    autoDeploy: true
    plan: free  # or "starter", "standard" for paid plans

    # Disk volume for persistent storage (needed for your image uploads)
    disk:
      name: data_volume
      mountPath: /var/data
      sizeGB: 1  # Adjust based on your needs

    # Environment variables (add your sensitive ones here)
    env:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
